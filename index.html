function ring(p,size,stroke,color,inner='',track='#eee'){const r=(size-stroke)/2,c=2*Math.PI*r;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${track}" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><div class="c">${inner}</div></div>`}
function wave(w=150,h=46,color=M){let d='M0 '+h/2;const pat=[0,0,0,-4,4,0,-20,22,-6,0,0,3,0,0];let x=0;while(x<w){for(const y of pat){x+=w/56;d+=` L${x.toFixed(1)} ${(h/2+y*h/50).toFixed(1)}`}}return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`}
function line(vals,w=150,h=50,color=M,fill=true){const mx=Math.max(...vals),mn=Math.min(...vals),pts=vals.map((v,i)=>[i*w/(vals.length-1),h-4-(v-mn)/(mx-mn||1)*(h-10)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${fill?`<path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".12"/>`:''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#fff" stroke="${color}" stroke-width="1.6"/>`).join('')}</svg>`}
function bars(vals,labels,h=90,color=M,hl=-1){const mx=Math.max(...vals);return `<div style="display:flex;align-items:flex-end;gap:8px;height:${h+18}px">${vals.map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v/mx*h}px;background:${i===hl?color:color+'55'};border-radius:5px 5px 2px 2px;${i===hl?'':''}"></div><div class="xs mu" style="margin-top:4px">${labels[i]}</div></div>`).join('')}</div>`}
function pie(data,size=170){let a=0;const tot=data.reduce((s,d)=>s+d[1],0),r=size/2;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${data.map(([l,v,c])=>{const a0=a,a1=a+v/tot*Math.PI*2;a=a1;const x0=r+r*Math.sin(a0),y0=r-r*Math.cos(a0),x1=r+r*Math.sin(a1),y1=r-r*Math.cos(a1),m=(a0+a1)/2;return `<path d="M${r} ${r} L${x0} ${y0} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${r+r*.64*Math.sin(m)}" y="${r-r*.64*Math.cos(m)}" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">${l}</text><text x="${r+r*.64*Math.sin(m)}" y="${r-r*.64*Math.cos(m)+12}" fill="#fff" font-size="9" text-anchor="middle">${Math.round(v/tot*100)}%</text>`}).join('')}</svg>`}

R.wallet=()=>`${tb('myHealth Wallet',{logo:1})}<div class="stepper" id="stp">${STEPS.map((s,i)=>`<div class="st ${i===S.step?'on':S.done.has(i)?'done':''}" onclick="S.step=${i};render('wallet')"><i>${S.done.has(i)&&i!==S.step?I.check:i+1}</i><span>${s}</span></div>`).join('')}</div>

share:()=>`<div class="grab"></div><div class="hd"><b>Share</b><button class="iconbtn" onclick="closeSheet()">${I.x}</button></div><div class="bd"><div class="row" style="gap:16px;overflow-x:auto;padding:12px 0">${[['Sarah Davis',1],['Emma Davis',5],['Dr. Allison Kim',2],['Robert Davis',6],['Mike Torres',3]].map(([n,i])=>`<div style="text-align:center;width:64px;flex-shrink:0;cursor:pointer" onclick="closeSheet();toast('Shared with ${n}')">${av(n,'lg',i).replace('class="av lg"','class="av lg" style="margin:0 auto 6px;background:linear-gradient(135deg,'+AVC[i]+')"')}<div class="xs">${n.split(' ')[0]==='Dr.'?'Dr. Kim':n.split(' ')[0]}</div></div>`).join('')}</div>

function openSheet(k){$('#sheet').innerHTML=SHEETS[k]();$('#modal').classList.add('on')}
function closeSheet(){$('#modal').classList.remove('on')}

const PILLS=['AFib','Gout','Fibroids','Hepatitis','CHF','Diabetes','Depression','Flu','Fibroids','Hepatitis','Lyme'];
R.community=()=>`${tb('myHealth Community',{logo:1})}<div class="scroll"><div class="srch"><input class="in" placeholder="Search and select disease state" oninput="filterTopics(this.value)">${I.search}</div>
<div class="sec">Related Topics</div><div>${[...new Set(PILLS)].map(p=>`<span class="pill" onclick="openTopic('${TOPICS.find(t=>t[0]===p)?p:'Arthritis'}')">${p}</span>`).join('')}</div>

<button class="btn" style="margin-top:10px" onclick="openTopic('Arthritis')">Go to myHealth Community</button></div>${nav('community')}`;
function filterTopics(v){$$('#tlist .topic').forEach(t=>t.style.display=t.dataset.n.includes(v.toLowerCase())?'':'none')}
function openTopic(n){S.topic=n;go('topic')}
const POSTS=[['Williams Thomas','There\'s likely no arthritis diagnosis I\'ve heard of more often after 40. Here are some things you can expect.','Arthritis is a common condition that causes pain and inflammation in a joint. Low-impact movement, weight management and the right medication plan made a huge difference for me.',24,8],['Daniel Joe','What are the causes and types of arthritis? How do I know which one I have?','There are more than 100 types. Osteoarthritis and rheumatoid arthritis are the most common — ask your doctor about an X-ray and a simple blood panel to tell them apart.',41,15],['David Samuel','Paraffin wax baths are suitable for people with arthritis in the hands or feet, and helping ease pain and stiffness.','I use one every evening for 15 minutes. My grip strength is noticeably better in the morning.',18,6],['James Cameron','Has anyone tried physical therapy before considering knee surgery?','My orthopedist suggested 8 weeks of PT first and I\'m at week 5 — already walking further with less pain.',12,9]];
R.topic=()=>{const t=TOPICS.find(x=>x[0]===S.topic)||TOPICS[5];return `${tb(t[0])}<div class="scroll"><div class="hero" style="background:linear-gradient(135deg,${M},#5a0a1c)"><span class="emo">${t[1]}</span><div style="position:relative">${t[0]}<div class="xs" style="font-weight:500;opacity:.9">${(t[0].length*137)%900+120} members · Moderated by health professionals</div></div></div>
<div class="row" style="margin-bottom:14px"><button class="btn sm" style="flex:1" onclick="toast('Showing member stories')">📖 Stories</button><button class="btn ol sm" style="flex:1" onclick="go('chatlist')">${I.cmt} Chat</button></div>
<div class="card row" style="padding:10px">${me()}<input class="in" style="height:38px;border-radius:20px" placeholder="Share your story or ask a question…" onkeydown="if(event.key==='Enter'&&this.value){toast('Posted to ${t[0]} community');this.value=''}"></div>
${POSTS.map(([a,q,p,l,c],i)=>`<div class="card post"><div class="ph">${av(a,'',i+1)}<div style="flex:1"><b class="sm">${a}</b><div class="xs mu">${['10/29/2026','10/28/2026','10/27/2026','10/25/2026'][i]} · ${['9:12am','4:40pm','12:06pm','8:30am'][i]}</div></div><button class="iconbtn" style="color:var(--m)" onclick="openSheet('share')">${I.share}</button></div><div class="q">${q}</div><p>${p}</p><div class="acts"><span onclick="this.classList.toggle('on');const b=this.querySelector('b');b.textContent=+b.textContent+(this.classList.contains('on')?1:-1)">${I.heart}<b>${l}</b></span><span>${I.cmt} ${c} replies</span><span onclick="openSheet('share')">${I.share} Share</span></div></div>`).join('')}</div>${nav('community')}`};
const PEOPLE=[['Williams Thomas','Wisconsin, USA'],['Henry M','Wisconsin, USA'],['David Samuel','Illinois, USA'],['Daniel Joe','Ohio, USA'],['James Cameron','Texas, USA'],['Andria Long','Florida, USA']];
R.chatlist=()=>`${tb('myHealth Community',{logo:1})}<div class="scroll"><div class="srch" style="margin-bottom:14px"><input class="in" placeholder="Search People">${I.search}</div><div class="pgrid">${PEOPLE.map(([n,l],i)=>`<div class="prof">${av(n,'lg',i+1).replace('class="av lg"','class="av lg" style="margin:0 auto 8px;background:linear-gradient(135deg,'+AVC[(i+1)%8]+')"')}<b class="sm">${n}</b><div class="xs mu" style="margin:2px 0 10px">${l}</div><button class="btn sm" style="margin:0 auto" onclick="S.thread=${i};go('chat')">${I.cmt} Chat</button></div>`).join('')}</div></div>${nav('community')}`;
const SEED=[['r','Hi Jonathan! Saw your post in the Arthritis group 👋','9:02'],['s','Hey! Thanks for reaching out. How has PT been going for you?','9:04'],['r','Honestly really well. Week 5 and my knee feels so much better.','9:05'],['r','Did your doctor recommend any specific exercises?','9:05'],['s','Mostly cycling and swimming. Low impact stuff.','9:07']];
R.chat=()=>{const p=PEOPLE[S.thread||0];const m=S.chats[S.thread]||(S.chats[S.thread]=SEED.slice());return `${sbar()}<div class="topbar"><button class="iconbtn" onclick="back()">${I.back}</button>${av(p[0],'',(S.thread||0)+1)}<div style="flex:1"><b class="sm">${p[0]}</b><div class="xs" style="color:var(--g)">● Online</div></div><button class="iconbtn" style="color:var(--m)" onclick="toast('Starting video call…')">${I.video}</button><button class="iconbtn" style="color:var(--m)" onclick="toast('Calling…')">${I.phone}</button></div>
<div class="msgs" id="msgs"><div class="xs mu" style="text-align:center">Today</div>${m.map(([w,t,h])=>`<div class="msg ${w}">${t}<small>${h} AM</small></div>`).join('')}</div>
<div class="composer"><input class="in" id="cin" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">${I.send}</button></div>`};
function sendMsg(){const v=$('#cin').value.trim();if(!v)return;const m=S.chats[S.thread];m.push(['s',v.replace(/</g,'&lt;'),'9:4'+(m.length%10)]);render('chat');setTimeout(()=>{m.push(['r',['That makes sense! 😊','Thanks for sharing — let\'s keep each other posted.','Great idea, I\'ll try that too.'][m.length%3],'9:4'+(m.length%10)]);if(cur==='chat')render('chat')},1200)}

const TH=[['linear-gradient(135deg,#4A90E2,#1c3f6e)','🧬'],['linear-gradient(135deg,#DC143C,#5a0a1c)','🫀'],['linear-gradient(135deg,#2EAD6B,#0f5132)','🥗'],['linear-gradient(135deg,#7B61FF,#2d1f7a)','🧠'],['linear-gradient(135deg,#F5A623,#9a5b00)','🏃'],['linear-gradient(135deg,#20B2AA,#0b4f4c)','💊']];

if(t==='Articles')b=`<div class="srch"><input class="in" placeholder="Search for Articles">${I.search}</div><div class="sec">Trending <span class="link">See all</span></div><div class="hs">${[['Exercise medicine has revolutionised cancer care over the past decade.','Health News'],['Understanding your A1C: what the numbers really mean','Diabetes'],['5 heart-healthy habits cardiologists swear by','Heart']].map(([h,c],i)=>`<div class="card" style="width:250px;padding:0;overflow:hidden;margin:0" onclick="toast('Opening article…')">${thumb(i,130)}<div style="padding:12px"><span class="tag" style="background:var(--ml);color:var(--m)">${c}</span><div class="b sm" style="margin-top:6px">${h}</div><div class="acts" style="margin-top:8px"><span>${I.heart} ${12+i*7}</span><span>${I.cmt} ${3+i}</span><span>🕑 ${4+i} min</span></div></div></div>`).join('')}</div>
<div class="sec">Recommendations</div>${[['Daniel Joe','Edith Cowan University researchers have developed a new assessment tool that can predict Huntington\'s disease'],['Dr. Allison Kim','Lowering sodium: small swaps that make a big difference for blood pressure'],['Mental Health Today','Why a 10-minute walk after meals can lower blood sugar'],['Dr. Noel Haque','Joint pain in winter: myth or science?'],['CDC Health','Flu season 2026: who should get vaccinated and when']].map(([a,h],i)=>`<div class="art" onclick="toast('Opening article…')"><div class="thumb" style="background:${TH[(i+2)%6][0]};width:92px;height:76px"><span class="emo" style="font-size:34px">${TH[(i+2)%6][1]}</span></div><div style="flex:1"><div class="xs mu">${a} · 10/2${9-i}/2026</div><div class="b sm" style="margin-top:3px">${h}</div><div class="acts" style="margin-top:6px"><span>${I.heart} ${30-i*4}</span><span>${I.share}</span></div></div></div>`).join('')}`;
if(t==='Video')b=`<div class="srch"><input class="in" placeholder="Search for Video">${I.search}</div><div class="sec">Recommendations</div>${[['Type 2 diabetes: Symptoms, causes and its treatments','12:40'],['How your heart works — an animated guide','8:15'],['Gentle yoga for arthritis relief','22:03'],['Mindfulness in 5 minutes a day','5:10'],['Reading a nutrition label like a dietitian','9:47']].map(([h,d],i)=>`<div class="card" style="padding:0;overflow:hidden" onclick="toast('Playing: ${h.replace(/'/g,'')}')">${thumb(i+1,180,`<div class="play">${I.play}</div><div class="dur">${d}</div>`)}<div style="padding:12px"><div class="b sm">${h}</div><div class="acts"><span>👁 ${(i+2)*1.3|0}.${i}k views</span><span>${I.heart} ${40+i*9}</span><span>${I.share}</span></div></div></div>`).join('')}`;
if(t==='Live')b=`<div class="sec">Live Now</div>${[['Ask a Cardiologist: Managing High Blood Pressure','Dr. Allison Kim','312 watching'],['Diabetes Kitchen: Low-carb dinners','Chef Maria Lopez, RD','128 watching']].map(([h,a,w],i)=>`<div class="card" style="padding:0;overflow:hidden">${thumb(i+1,160,`<div class="live"><i></i>LIVE</div><div class="dur">👁 ${w}</div>`)}<div style="padding:12px" class="row between"><div><div class="b sm">${h}</div><div class="mu">${a}</div></div><button class="btn sm" onclick="toast('Joining live session…')">Join</button></div></div>`).join('')}
<div class="sec">Upcoming</div>${[['Sleep & Your Heart','Nov 3, 2026 · 6:00 PM CT','Dr. Noel Haque'],['Caregiver Q&A: Avoiding Burnout','Nov 7, 2026 · 12:00 PM CT','Lisa Grant, LCSW'],['Arthritis: New Treatments in 2026','Nov 12, 2026 · 7:00 PM CT','Dr. Marcus Lee']].map(([h,d,a],i)=>`<div class="card row"><div class="thumb" style="background:${TH[i+3][0]};width:64px;height:64px;flex-shrink:0"><span class="emo" style="font-size:28px">${TH[i+3][1]}</span></div><div style="flex:1"><div class="b sm">${h}</div><div class="xs mu">${a}</div><div class="xs" style="color:var(--m);margin-top:2px">${d}</div></div><button class="btn ol sm" onclick="this.textContent='Registered ✓';this.className='btn gh sm';toast('You are registered!')">Register</button></div>`).join('')}`;
return `${tb('myHealth University',{logo:1})}<div class="tabs">${['Articles','Video','Live'].map(x=>`<button class="${x===t?'on':''}" onclick="S.uni='${x}';render('university')">${x}</button>`).join('')}</div><div class="scroll">${b}</div>${nav('university')}`};

const DOCS=[['Dr. Allison Kim','Primary Care · Internal Medicine','Northwestern Medicine',4.9,'$15',12],['Dr. Noel Haque','Primary Care · Endocrinology','Rush Medical Group',4.8,'$20',9],['Dr. Priya Shah','Primary Care · Family Medicine','Advocate Health',4.7,'$15',15],['Dr. Marcus Lee','Primary Care · Sports Medicine','UChicago Medicine',4.8,'$25',11]];
const MDOCS=[['Dr. Lisa Grant','Mental Health · LCSW Therapist','Thriveworks Chicago',4.9,'$10',8],['Dr. Omar Reyes','Mental Health · Psychiatry','Northwestern Medicine',4.8,'$30',14],['Dr. Hannah Cole','Mental Health · Psychology','Lakeview Counseling',4.7,'$20',10]];
let APPTS=[['Dr. Allison Kim','Primary Care','Nov 6, 2026','10:30 AM','Upcoming','Video'],['Dr. Lisa Grant','Mental Health','Nov 10, 2026','4:00 PM','Upcoming','Video'],['Dr. Noel Haque','Primary Care','Oct 20, 2026','9:00 AM','Completed','Video'],['Dr. Allison Kim','Primary Care','Sep 28, 2026','11:15 AM','Completed','Audio'],['Dr. Omar Reyes','Mental Health','Sep 14, 2026','2:30 PM','Missed','Video'],['Dr. Marcus Lee','Primary Care','Aug 30, 2026','1:00 PM','Cancelled','Video']];
const SC={Completed:'#22A45D',Missed:'#DC143C',Cancelled:'#9E9EA6',Upcoming:'#E91E63'};
const cnt=s=>({Completed:25,Missed:4,Cancelled:1,Upcoming:0}[s]+APPTS.filter(a=>a[4]===s&&s==='Upcoming').length);
R.telehealth=()=>`${tb('TeleHealth',{logo:1})}<div class="scroll"><div class="b" style="text-align:center;margin:4px 0 12px">Search Physician based on Speciality</div><div class="grid2"><div class="spec" style="background:linear-gradient(160deg,#4A90E2,#173d6b)" onclick="S.spec='p';go('doctors')"><span class="emo">👩‍⚕️</span><span style="position:relative">Primary Care</span></div><div class="spec" style="background:linear-gradient(160deg,${M},#5a0a1c)" onclick="S.spec='m';go('doctors')"><span class="emo">🧠</span><span style="position:relative">Mental Health</span></div></div>
<div class="b" style="text-align:center;margin:20px 0 12px">Appointments</div><div class="grid2">${['Completed','Missed','Cancelled','Upcoming'].map(s=>`<div class="stat" style="border-color:${SC[s]}" onclick="S.af='${s}';go('appts')"><div class="sm b" style="color:${SC[s]}">${s}</div><div class="n">${cnt(s)}</div></div>`).join('')}</div>
<div class="sec">Next Appointment</div>${apptCard(0)}<button class="btn" style="margin-top:4px" onclick="S.af='All';go('appts')">View All Appointments</button></div>${nav('telehealth')}`;
function apptCard(i){const a=APPTS[i];return `<div class="card row" style="cursor:pointer" onclick="S.appt=${i};go('appt')">${av(a[0],'',i+2)}<div style="flex:1"><b class="sm">${a[0]}</b><div class="mu">${a[1]} · ${a[5]} Consultation</div><div class="xs mu row" style="gap:4px;margin-top:3px">${I.cal} ${a[2]} · ${a[3]}</div></div><span class="tag st-${a[4]}">${a[4]}</span></div>`}
R.appts=()=>{const f=S.af||'All';return `${tb('Appointments')}<div class="scroll"><div class="hs" style="margin-bottom:6px">${['All','Upcoming','Completed','Missed','Cancelled'].map(x=>`<span class="pill ${x===f?'on':''}" onclick="S.af='${x}';render('appts')">${x}</span>`).join('')}</div>${APPTS.map((a,i)=>f==='All'||a[4]===f?apptCard(i):'').join('')||'<div class="mu" style="text-align:center;padding:40px">No appointments</div>'}</div>${nav('telehealth')}`};
R.doctors=()=>{const L=S.spec==='m'?MDOCS:DOCS;return `${tb(S.spec==='m'?'Mental Health':'Primary Care')}<div class="scroll"><div class="srch" style="margin-bottom:12px"><input class="in" placeholder="Search doctor, speciality, hospital">${I.search}</div>${L.map((d,i)=>`<div class="card"><div class="doc">${av(d[0],'lg',i+2)}<div style="flex:1"><b>${d[0]}</b><div class="mu">${d[1]}</div><div class="xs mu">${d[2]}</div><div class="xs" style="margin-top:3px"><span class="star">★</span> ${d[3]} · ${d[5]} yrs exp · <b style="color:var(--m)">${d[4]} copay</b></div></div></div><button class="btn sm" style="width:100%;margin-top:12px" onclick="S.doc=${i};go('book')">${I.video} Book Video Consultation</button></div>`).join('')}</div>${nav('telehealth')}`};
const SLOTS={Morning:['8:00 AM','8:30 AM','9:00 AM','9:30 AM','10:00 AM','10:30 AM'],Afternoon:['12:00 PM','12:30 PM','1:30 PM','2:00 PM','3:00 PM','3:30 PM'],Evening:['5:00 PM','5:30 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM'],Night:['8:00 PM','8:30 PM','9:00 PM','9:30 PM']};
const DAYS=[...Array(14)].map((_,i)=>{const d=new Date(2026,9,29+i);return [d.toLocaleDateString('en-US',{weekday:'short'}),d.getDate(),d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})]});
R.book=()=>{const d=(S.spec==='m'?MDOCS:DOCS)[S.doc||0];return `${tb('TeleHealth',{logo:1})}<div class="scroll"><div class="card" style="text-align:center">${av(d[0],'xl',(S.doc||0)+2).replace('class="av xl"','class="av xl" style="margin:0 auto 10px;background:linear-gradient(135deg,'+AVC[((S.doc||0)+2)%8]+')"')}<div class="h3">${d[0]}</div><div class="mu">${d[1]}</div><div class="row" style="justify-content:center;gap:16px;margin-top:10px;font-size:13px"><span><span class="star">★</span> ${d[3]}</span><span>${d[5]} yrs</span><b style="color:var(--m)">${d[4]} copay</b><span>45 min</span></div></div>
<div class="sec">Select Date <span class="mu">Oct – Nov 2026</span></div><div class="days">${DAYS.map((x,i)=>`<div class="day ${i===S.day?'on':''}" onclick="S.day=${i};render('book')">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>
<div class="sec">Available Time</div><div class="seg">${Object.keys(SLOTS).map(k=>`<button class="${k===S.slotT?'on':''}" onclick="S.slotT='${k}';render('book')">${k}</button>`).join('')}</div><div class="slots">${SLOTS[S.slotT].map((t,i)=>`<button class="slot ${t===S.slot?'on':''} ${(i+S.day)%5===3?'x':''}" onclick="S.slot='${t}';render('book')">${t}</button>`).join('')}</div>
<div class="card" style="margin-top:16px;background:var(--ml);box-shadow:none"><b class="sm" style="color:var(--m)">Appointment Time : ${DAYS[S.day][2]} (${S.slot})</b></div>
${sel('Appointment For',['Self – Jonathan Davis','Sarah Davis (Spouse)','Emma Davis (Child)'],'')}${sel('Insurance',['Blue Cross Blue Shield of IL – XGH 884210337','Self-pay'],'')}<label class="f">Reason for Visit</label><textarea class="in" placeholder="Describe your symptoms">Follow-up on blood pressure readings and medication timing.</textarea>
<label class="f">Translator Needed?</label><div class="radio"><label><input type="radio" name="tr"> Yes</label><label><input type="radio" name="tr" checked> No</label></div>
<label class="f">Prescription / Documents</label><div class="upl" onclick="this.innerHTML='✅ <b>bp_log_oct.pdf</b><div class=mu>Uploaded</div>'">${I.up}<div class="b sm">Upload Here</div><div class="mu">You can upload a image or Capture image of the RX</div></div>
<div style="height:18px"></div><button class="btn" onclick="confirmBook()">Confirm</button></div>${nav('telehealth')}`};
function confirmBook(){const d=(S.spec==='m'?MDOCS:DOCS)[S.doc||0];APPTS.unshift([d[0],S.spec==='m'?'Mental Health':'Primary Care',DAYS[S.day][2],S.slot,'Upcoming','Video']);S.appt=0;toast('Appointment booked ✓');go('appt',true)}

${up?`<div class="row" style="margin-top:18px"><button class="btn sm" style="flex:1;height:42px" onclick="toast('Connecting video call…')">${I.video} Video Call</button><button class="btn sm" style="flex:1;height:42px" onclick="toast('Connecting audio call…')">${I.phone} Audio Call</button></div>`:''}</div>
<div class="card"><div class="kv"><span class="mu">Appointment For</span><b>Self – Jonathan Davis</b></div><div class="kv"><span class="mu">Insurance</span><b>BCBS of IL</b></div><div class="kv"><span class="mu">Copay</span><b>$15.00</b></div><div class="kv"><span class="mu">Translator</span><b>No</b></div><div class="kv"><span class="mu">Reason</span><b style="text-align:right;max-width:60%">BP follow-up</b></div></div>

/* ---------- router ---------- */
function centerStep(){const s=$('#stp'),a=s&&s.querySelector('.st.on');if(a)s.scrollLeft=a.offsetLeft-s.clientWidth/2+a.offsetWidth/2}
let cur=null;const NOHIST=['splash','welcome'];
function render(id){const el=$('#s-'+id);if(!el)return;const sc=el.querySelector('.scroll');const y=sc?sc.scrollTop:0;el.innerHTML=R[id]();if(id===cur){const n=el.querySelector('.scroll');if(n&&id!=='wallet')n.scrollTop=y}if(id==='wallet')centerStep();if(id==='chat'){const m=$('#msgs');m.scrollTop=m.scrollHeight}}
function go(id,replace){if(!R[id])id='home';if(cur&&cur!==id&&!replace&&!NOHIST.includes(cur))S.stack.push(cur);closeSheet();render(id);$$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));cur=id;if(id==='wallet')centerStep();if(id==='chat'){const m=$('#msgs');m.scrollTop=m.scrollHeight}if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}
function back(){const p=S.stack.pop();if(p){const c=cur;cur=null;go(p,true)}else go('home',true)}
document.addEventListener('DOMContentLoaded',()=>{const ph=$('#phone');Object.keys(R).forEach(k=>{const s=document.createElement('section');s.className='screen';s.id='s-'+k;ph.appendChild(s)});$('#s-welcome').onclick=()=>go('login');let h=location.hash.slice(1);const wm=h.match(/^wallet-(\d+)$/);if(wm){S.step=Math.min(12,Math.max(0,wm[1]-1));h='wallet'}if(h&&R[h]&&!NOHIST.includes(h)){go(h)}else{go('splash');setTimeout(()=>{go('welcome');setTimeout(()=>{if(cur==='welcome')go('login')},2600)},2400)}});
</script></body></html>
